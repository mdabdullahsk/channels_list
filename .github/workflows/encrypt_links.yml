name: Encrypt IPTV Links

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # প্রতিদিন রাত ১২টায় রান হবে

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # এটি সরাসরি রানারকে ফাইল পুশ করার পারমিশন দেবে
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Initialize Package and Install Crypto-JS
      run: |
        npm init -y
        npm install crypto-js

    - name: Run Encryption Script
      env:
        IPTV_LINKS: ${{ secrets.IPTV_LINKS }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      run: |
        node -e "
        try {
          const CryptoJS = require('crypto-js');
          const links = process.env.IPTV_LINKS;
          const key = process.env.ENCRYPTION_KEY;
          
          if (!links || !key) {
            console.error('Error: Secrets are missing!');
            process.exit(1);
          }
          
          const encrypted = CryptoJS.AES.encrypt(links, key).toString();
          const fs = require('fs');
          fs.writeFileSync('channels.json', JSON.stringify({ data: encrypted }));
          console.log('Encryption successful!');
        } catch (err) {
          console.error(err);
          process.exit(1);
        }
        "

    - name: Commit and Push Encrypted File
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add channels.json
        git commit -m "Automated: Update encrypted TV links" || exit 0
        git push
